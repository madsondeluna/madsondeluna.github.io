<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDB2FASTA</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>PDB to FASTA Converter</h1>
            <p>Paste or upload a PDB file to convert it to FASTA</p>
        </header>

        <main>
            <div class="converter-grid">
                <div class="io-box">
                    <h2>PDB Input</h2>
                    <label for="pdb-upload" class="upload-btn">Upload PDB File</label>
                    <input type="file" id="pdb-upload" accept=".pdb" hidden>
                    <textarea id="pdb-input" rows="15" placeholder="Or paste PDB content here..."></textarea>
                </div>

                <div class="io-box">
                    <h2>FASTA Output</h2>
                    <div class="output-controls">
                        <button id="copy-btn">Copy to Clipboard</button>
                    </div>
                    <textarea id="fasta-output" rows="15" readonly placeholder="FASTA formatted output will appear here..."></textarea>
                </div>

                <button id="convert-btn">Convert</button>
                <button id="clear-btn">Clear</button>
                
            </div> 
        </main>
        <footer>
            <p>© 2025. GROMADS. All rights reserved.</p>
        </footer>
    </div>

    <script src="js/converter.js"></script>
</body>
</html>
