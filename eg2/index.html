<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star to Black Hole Simulation with Gemini AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #00001a;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
        }
        .btn {
            transition: background-color 0.3s, transform 0.2s;
        }
        .btn:hover:not(:disabled) {
            transform: scale(1.05);
        }
        .btn-primary {
            background-color: #3b82f6;
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background-color: #2563eb;
        }
        .btn-secondary {
            background-color: #4b5563;
            color: white;
        }
        .btn-secondary:hover:not(:disabled) {
            background-color: #374151;
        }
        .btn-ai {
            background-color: #8b5cf6;
            color: white;
        }
        .btn-ai:hover:not(:disabled) {
            background-color: #7c3aed;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #aiModal.hidden {
            display: none;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-white overflow-hidden">

    <div class="absolute top-0 left-0 w-full h-full" id="starfield"></div>

    <div class="relative min-h-screen flex flex-col items-center justify-center p-4 z-10">
        <h1 class="text-4xl md:text-5xl font-bold mb-4 text-center tracking-widest text-shadow-lg shadow-blue-400">Journey to a Black Hole</h1>

        <div class="w-full max-w-5xl aspect-video rounded-2xl overflow-hidden glass-panel shadow-2xl shadow-blue-500/20">
            <canvas id="simulationCanvas"></canvas>
        </div>

        <div class="w-full max-w-5xl mt-4 grid grid-cols-1 md:grid-cols-3 gap-4">
            <div id="infoPanel" class="glass-panel p-4 rounded-2xl col-span-1 md:col-span-2 text-center md:text-left flex flex-col justify-between">
                <div>
                    <h2 class="text-2xl font-bold mb-2" id="stageName">Not Started</h2>
                    <p class="text-sm text-gray-300" id="stageDescription">Press 'Start Simulation' to begin the life cycle of a massive star.</p>
                    <div class="mt-3">
                        <span class="font-bold">Time Elapsed: </span><span id="timer">0.00 billion years</span>
                    </div>
                </div>
                <button id="askAiButton" class="hidden mt-4 w-full md:w-auto self-start py-2 px-4 rounded-lg font-bold text-lg btn btn-ai">✨ Ask the Cosmos</button>
            </div>
            <div class="flex flex-col justify-center gap-3 p-4 glass-panel rounded-2xl">
                 <button id="startButton" class="w-full py-3 rounded-lg font-bold text-lg btn btn-primary">Start Simulation</button>
                 <button id="pauseButton" class="w-full py-3 rounded-lg font-bold text-lg btn btn-secondary" disabled>Pause</button>
                 <button id="resetButton" class="w-full py-3 rounded-lg font-bold text-lg btn btn-secondary" disabled>Reset</button>
            </div>
        </div>
    </div>

    <!-- AI Modal -->
    <div id="aiModal" class="hidden fixed inset-0 bg-black bg-opacity-70 z-50 flex items-center justify-center p-4">
        <div class="glass-panel rounded-2xl p-6 w-full max-w-2xl max-h-full overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-2xl font-bold">Ask the Cosmos</h3>
                <button id="closeAiModal" class="text-2xl font-bold">&times;</button>
            </div>
            <div id="aiInteraction">
                <p class="mb-2">Ask a question about the <strong id="aiContextStage"></strong> stage.</p>
                <textarea id="aiQuestionInput" class="w-full p-2 rounded-lg bg-gray-800 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-purple-500" rows="3" placeholder="e.g., Why is this star blue?"></textarea>
                <button id="submitAiQuestion" class="mt-2 w-full py-2 rounded-lg font-bold btn btn-ai">Get Insight</button>
            </div>
            <div id="aiLoading" class="hidden flex-col items-center justify-center py-8">
                <div class="spinner"></div>
                <p class="mt-4">Consulting the cosmic archives...</p>
            </div>
            <div id="aiResponse" class="hidden mt-4">
                <h4 class="font-bold text-xl mb-2">Cosmic Insight:</h4>
                <div id="aiResponseText" class="text-gray-300 bg-black bg-opacity-20 p-4 rounded-lg"></div>
                <button id="askAnotherQuestion" class="mt-4 w-full py-2 rounded-lg font-bold btn btn-secondary">Ask Another Question</button>
            </div>
        </div>
    </div>

    <script>
        // --- Canvas and Context Setup ---
        const canvas = document.getElementById('simulationCanvas');
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        // --- DOM Elements ---
        const startButton = document.getElementById('startButton');
        const pauseButton = document.getElementById('pauseButton');
        const resetButton = document.getElementById('resetButton');
        const stageNameEl = document.getElementById('stageName');
        const stageDescriptionEl = document.getElementById('stageDescription');
        const timerEl = document.getElementById('timer');
        const starfieldEl = document.getElementById('starfield');
        const askAiButton = document.getElementById('askAiButton');
        const aiModal = document.getElementById('aiModal');
        const closeAiModal = document.getElementById('closeAiModal');
        const aiContextStage = document.getElementById('aiContextStage');
        const aiQuestionInput = document.getElementById('aiQuestionInput');
        const submitAiQuestion = document.getElementById('submitAiQuestion');
        const aiInteraction = document.getElementById('aiInteraction');
        const aiLoading = document.getElementById('aiLoading');
        const aiResponse = document.getElementById('aiResponse');
        const aiResponseText = document.getElementById('aiResponseText');
        const askAnotherQuestion = document.getElementById('askAnotherQuestion');

        // --- Simulation State ---
        let isRunning = false;
        let isPaused = false;
        let time = 0;
        let stageIndex = 0;

        // --- Simulation Parameters ---
        const STAGES = [
            { name: "Protostar", duration: 2, description: "A dense cloud of gas and dust collapses under gravity, heating up to form a protostar. This phase lasts for about 500,000 real years." },
            { name: "Main Sequence", duration: 10, description: "Nuclear fusion ignites in the core. The star enters a long, stable phase, fusing hydrogen into helium. A massive star shines brightly with a blueish light." },
            { name: "Red Supergiant", duration: 3, description: "The star exhausts its core hydrogen, causing it to expand dramatically and cool down, turning into a red supergiant." },
            { name: "Supernova", duration: 1, description: "The core collapses catastrophically, triggering a massive explosion that outshines entire galaxies for a brief period." },
            { name: "Black Hole", duration: Infinity, description: "The remnant of the supernova's core collapses into an infinitely dense point, a black hole, from which not even light can escape." }
        ];

        let particles = [], supernovaParticles = [], accretionDiskParticles = [];

        // --- Gemini API Function ---
        async function getAstroFact(question, contextStage) {
            aiInteraction.classList.add('hidden');
            aiLoading.classList.remove('hidden');
            aiResponse.classList.add('hidden');
            submitAiQuestion.disabled = true;

            const prompt = `You are an expert astronomer providing a concise, easy-to-understand explanation for a user exploring a simulation.
            Context: The user is currently observing the "${contextStage.name}" stage of a massive star's evolution. This stage is described as: "${contextStage.description}".
            Question: ${question}
            Please provide a direct answer to the question based on this context. Keep it to 2-3 sentences.`;

            const chatHistory = [{ role: "user", parts: [{ text: prompt }] }];
            const payload = { contents: chatHistory };
            const apiKey = ""; // API key will be provided by the environment
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                    throw new Error(`API Error: ${response.statusText}`);
                }

                const result = await response.json();
                
                if (result.candidates && result.candidates.length > 0 && result.candidates[0].content && result.candidates[0].content.parts.length > 0) {
                    aiResponseText.textContent = result.candidates[0].content.parts[0].text;
                } else {
                    throw new Error("Invalid response structure from API.");
                }
            } catch (error) {
                console.error("Gemini API call failed:", error);
                aiResponseText.textContent = "Sorry, the cosmic archives are a bit fuzzy right now. Please try again later.";
            } finally {
                aiLoading.classList.add('hidden');
                aiResponse.classList.remove('hidden');
                submitAiQuestion.disabled = false;
            }
        }

        // --- Utility Functions ---
        let centerX, centerY;
        function resizeCanvas() {
            const container = canvas.parentElement;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = container.clientWidth * dpr;
            canvas.height = container.clientHeight * dpr;
            ctx.scale(dpr, dpr);
            
            // Use logical size for centering calculations
            centerX = container.clientWidth / 2;
            centerY = container.clientHeight / 2;
        }

        // --- Particle Systems ---
        function createParticles(count) {
            const newParticles = [];
            for (let i = 0; i < count; i++) {
                const radius = Math.random() * 2;
                const angle = Math.random() * Math.PI * 2;
                const distance = (centerX / 5) + Math.random() * 50;
                newParticles.push({ x: centerX + Math.cos(angle)*distance, y: centerY + Math.sin(angle)*distance, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5, radius: radius, alpha: Math.random(), angle: angle, distance: distance, speed: (Math.random()*0.005)+0.002 });
            }
            return newParticles;
        }
        function createSupernovaParticles(count) {
            const newParticles = [];
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                newParticles.push({ x: centerX, y: centerY, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, radius: Math.random()*2.5+1, alpha: 1, decay: Math.random()*0.01+0.01 });
            }
            return newParticles;
        }
        function createAccretionDisk(count) {
            const newParticles = [];
            for (let i = 0; i < count; i++) {
                const distance = 40 + Math.random() * 80;
                const angle = Math.random() * Math.PI * 2;
                const speed = 0.005 / (distance / 50);
                newParticles.push({ angle: angle, distance: distance, yOffset: (Math.random()-0.5)*20*(distance/120), radius: Math.random()*1.5, speed: speed, alpha: Math.random()*0.5+0.2 });
            }
            return newParticles;
        }

        // --- Drawing Functions ---
        function drawProtostar(progress) {
            particles.forEach(p => {
                p.angle += p.speed; p.distance -= 0.05; p.x = centerX + Math.cos(p.angle)*p.distance; p.y = centerY + Math.sin(p.angle)*p.distance; p.alpha = Math.min(1, p.alpha+0.005);
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fillStyle = `rgba(255, 229, 180, ${p.alpha})`; ctx.fill();
            });
            const glowRadius = 10 + 20 * progress;
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, glowRadius);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.9)'); gradient.addColorStop(0.5, 'rgba(255, 204, 102, 0.5)'); gradient.addColorStop(1, 'rgba(255, 153, 51, 0)');
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, canvas.parentElement.clientWidth, canvas.parentElement.clientHeight);
        }
        function drawMainSequenceStar() {
            const radius = 30;
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)'); gradient.addColorStop(0.2, 'rgba(200, 220, 255, 1)'); gradient.addColorStop(0.8, 'rgba(100, 150, 255, 0.8)'); gradient.addColorStop(1, 'rgba(50, 100, 200, 0)');
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, canvas.parentElement.clientWidth, canvas.parentElement.clientHeight);
        }
        function drawRedSupergiant(progress) {
            const radius = 30 + 70 * progress;
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
            gradient.addColorStop(0, 'rgba(255, 220, 180, 1)'); gradient.addColorStop(0.5, 'rgba(255, 100, 50, 0.8)'); gradient.addColorStop(1, 'rgba(200, 50, 0, 0)');
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, canvas.parentElement.clientWidth, canvas.parentElement.clientHeight);
        }
        function drawSupernova(progress) {
            const flashAlpha = Math.max(0, 1 - progress * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`; ctx.fillRect(0, 0, canvas.parentElement.clientWidth, canvas.parentElement.clientHeight);
            supernovaParticles.forEach(p => {
                p.x += p.vx; p.y += p.vy; p.alpha -= p.decay;
                if (p.alpha > 0) {
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); const colorVal = Math.floor(255*(p.alpha)); ctx.fillStyle = `rgba(255, ${colorVal}, ${Math.floor(colorVal/2)}, ${p.alpha})`; ctx.fill();
                }
            });
        }
        function drawBlackHole() {
            ctx.beginPath(); ctx.arc(centerX, centerY, 30, 0, Math.PI*2); ctx.fillStyle = 'black'; ctx.fill();
            accretionDiskParticles.forEach(p => {
                p.angle += p.speed; const x = centerX + Math.cos(p.angle)*p.distance; const y = centerY + Math.sin(p.angle)*p.distance*0.3 + p.yOffset; const perspectiveScale = 0.5 + Math.sin(p.angle)*0.5;
                ctx.beginPath(); ctx.arc(x, y, p.radius*perspectiveScale, 0, Math.PI*2); const temp = Math.floor(150 + 105*perspectiveScale); ctx.fillStyle = `rgba(255, ${temp}, 100, ${p.alpha*perspectiveScale})`; ctx.fill();
            });
        }

        // --- Main Simulation Loop ---
        let lastTime = 0, stageElapsedTime = 0, totalSimulatedYears = 0;
        function gameLoop(timestamp) {
            if (!isRunning || isPaused) { animationFrameId = requestAnimationFrame(gameLoop); lastTime = timestamp; return; }
            const deltaTime = (timestamp - lastTime) / 1000;
            lastTime = timestamp; stageElapsedTime += deltaTime; time += deltaTime;
            const currentStage = STAGES[stageIndex]; let progress = stageElapsedTime / currentStage.duration;
            if (stageIndex === 0) totalSimulatedYears = progress * 0.0005; else if (stageIndex === 1) totalSimulatedYears = 0.0005 + progress * 10; else if (stageIndex === 2) totalSimulatedYears = 10.0005 + progress * 1;
            timerEl.textContent = `${totalSimulatedYears.toFixed(4)} billion years`;
            ctx.clearRect(0, 0, canvas.parentElement.clientWidth, canvas.parentElement.clientHeight);
            switch (currentStage.name) {
                case "Protostar": drawProtostar(progress); break;
                case "Main Sequence": drawMainSequenceStar(); break;
                case "Red Supergiant": drawRedSupergiant(progress); break;
                case "Supernova": drawSupernova(progress); break;
                case "Black Hole": drawBlackHole(); timerEl.textContent = `> 11.0005 billion years`; break;
            }
            if (progress >= 1 && stageIndex < STAGES.length - 1) { stageIndex++; stageElapsedTime = 0; updateStageInfo(); }
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // --- UI and State Management ---
        function updateStageInfo() {
            const currentStage = STAGES[stageIndex];
            stageNameEl.textContent = currentStage.name;
            stageDescriptionEl.textContent = currentStage.description;
            askAiButton.classList.remove('hidden');
            if (currentStage.name === "Protostar") particles = createParticles(300);
            if (currentStage.name === "Supernova") supernovaParticles = createSupernovaParticles(500);
            if (currentStage.name === "Black Hole") accretionDiskParticles = createAccretionDisk(1000);
        }
        function startSimulation() {
            if (isRunning) return; isRunning = true; isPaused = false;
            startButton.textContent = 'Resume'; startButton.disabled = true; pauseButton.disabled = false; resetButton.disabled = false;
            updateStageInfo(); lastTime = performance.now(); animationFrameId = requestAnimationFrame(gameLoop);
        }
        function pauseSimulation() {
            if (!isRunning || isPaused) return; isPaused = true;
            pauseButton.disabled = true; startButton.disabled = false;
        }
        function resumeSimulation() {
            if (!isRunning || !isPaused) return; isPaused = false;
            pauseButton.disabled = false; startButton.disabled = true; lastTime = performance.now();
        }
        function resetSimulation() {
            cancelAnimationFrame(animationFrameId); isRunning = false; isPaused = false;
            time = 0; stageIndex = 0; stageElapsedTime = 0; totalSimulatedYears = 0;
            particles = []; supernovaParticles = []; accretionDiskParticles = [];
            ctx.clearRect(0, 0, canvas.parentElement.clientWidth, canvas.parentElement.clientHeight);
            stageNameEl.textContent = "Not Started";
            stageDescriptionEl.textContent = "Press 'Start Simulation' to begin the life cycle of a massive star.";
            timerEl.textContent = "0.00 billion years";
            startButton.textContent = 'Start Simulation'; startButton.disabled = false; pauseButton.disabled = true; resetButton.disabled = true;
            askAiButton.classList.add('hidden');
        }
        function createStarfield() {
            const starCount = 200;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div'); star.className = 'absolute rounded-full'; const size = Math.random() * 2;
                star.style.width = `${size}px`; star.style.height = `${size}px`; star.style.left = `${Math.random() * 100}%`; star.style.top = `${Math.random() * 100}%`; star.style.backgroundColor = `rgba(255, 255, 255, ${Math.random() * 0.5 + 0.3})`;
                starfieldEl.appendChild(star);
            }
        }

        // --- Event Listeners ---
        startButton.addEventListener('click', () => { isPaused ? resumeSimulation() : startSimulation(); });
        pauseButton.addEventListener('click', pauseSimulation);
        resetButton.addEventListener('click', resetSimulation);
        askAiButton.addEventListener('click', () => {
            const currentStage = STAGES[stageIndex];
            aiContextStage.textContent = currentStage.name;
            aiModal.classList.remove('hidden');
            aiInteraction.classList.remove('hidden');
            aiLoading.classList.add('hidden');
            aiResponse.classList.add('hidden');
            aiQuestionInput.value = '';
        });
        closeAiModal.addEventListener('click', () => aiModal.classList.add('hidden'));
        submitAiQuestion.addEventListener('click', () => {
            const question = aiQuestionInput.value;
            if (question.trim()) { getAstroFact(question, STAGES[stageIndex]); }
        });
        askAnotherQuestion.addEventListener('click', () => {
            aiResponse.classList.add('hidden');
            aiInteraction.classList.remove('hidden');
            aiQuestionInput.value = '';
            aiQuestionInput.focus();
        });
        window.addEventListener('resize', resizeCanvas);
        window.onload = () => { resizeCanvas(); createStarfield(); resetSimulation(); };
    </script>
</body>
</html>
