<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecosystem Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        canvas {
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
        }
        .control-panel {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            padding: 1.5rem;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto p-4 lg:p-8">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-900">Virtual Ecosystem Simulation</h1>
            <p class="text-lg text-gray-600 mt-2">Watch as species interact and evolve in a dynamic environment.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2">
                <canvas id="ecosystemCanvas"></canvas>
            </div>
            <div class="control-panel">
                <h2 class="text-2xl font-semibold mb-4">Controls</h2>
                <div class="space-y-4">
                    <button id="startStopButton" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg transition duration-300">Start</button>
                    <button id="resetButton" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg transition duration-300">Reset</button>
                </div>

                <h3 class="text-xl font-semibold mt-6 mb-4">Simulation Settings</h3>
                <div class="space-y-4">
                    <div>
                        <label for="herbivoreSlider" class="block text-sm font-medium text-gray-700">Initial Herbivores: <span id="herbivoreCount">50</span></label>
                        <input type="range" id="herbivoreSlider" min="1" max="200" value="50" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div>
                        <label for="carnivoreSlider" class="block text-sm font-medium text-gray-700">Initial Carnivores: <span id="carnivoreCount">10</span></label>
                        <input type="range" id="carnivoreSlider" min="1" max="100" value="10" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div>
                        <label for="plantSlider" class="block text-sm font-medium text-gray-700">Plant Growth Rate: <span id="plantRate">0.1</span></label>
                        <input type="range" id="plantSlider" min="0.01" max="0.5" step="0.01" value="0.1" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>

                <h3 class="text-xl font-semibold mt-6 mb-4">Statistics</h3>
                <div class="space-y-2 text-sm">
                    <p>Time Steps: <span id="timeStep">0</span></p>
                    <p>Plants: <span id="plantStat">0</span></p>
                    <p>Herbivores: <span id="herbivoreStat">0</span></p>
                    <p>Carnivores: <span id="carnivoreStat">0</span></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Canvas and context setup
        const canvas = document.getElementById('ecosystemCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const startStopButton = document.getElementById('startStopButton');
        const resetButton = document.getElementById('resetButton');
        const herbivoreSlider = document.getElementById('herbivoreSlider');
        const carnivoreSlider = document.getElementById('carnivoreSlider');
        const plantSlider = document.getElementById('plantSlider');
        const herbivoreCount = document.getElementById('herbivoreCount');
        const carnivoreCount = document.getElementById('carnivoreCount');
        const plantRate = document.getElementById('plantRate');
        const timeStepEl = document.getElementById('timeStep');
        const plantStatEl = document.getElementById('plantStat');
        const herbivoreStatEl = document.getElementById('herbivoreStat');
        const carnivoreStatEl = document.getElementById('carnivoreStat');

        // Simulation parameters
        let gridSize = 20;
        let worldWidth, worldHeight;
        let simulationRunning = false;
        let animationFrameId;
        let timeStep = 0;

        // World state
        let world = [];
        let herbivores = [];
        let carnivores = [];

        // Species base class
        class Organism {
            constructor(x, y, energy) {
                this.x = x;
                this.y = y;
                this.energy = energy;
            }

            move() {
                // Move randomly to an adjacent cell
                this.x += Math.floor(Math.random() * 3) - 1;
                this.y += Math.floor(Math.random() * 3) - 1;

                // Wrap around world edges
                this.x = (this.x + worldWidth) % worldWidth;
                this.y = (this.y + worldHeight) % worldHeight;

                this.energy -= 1; // Energy cost for moving
            }

            isAlive() {
                return this.energy > 0;
            }
        }

        class Herbivore extends Organism {
            constructor(x, y) {
                super(x, y, 50); // Initial energy
                this.reproductionThreshold = 80;
            }

            eat() {
                if (world[this.y][this.x] > 0) {
                    world[this.y][this.x] = 0; // Consume the plant
                    this.energy += 20;
                }
            }

            reproduce() {
                if (this.energy >= this.reproductionThreshold) {
                    this.energy -= 40; // Cost of reproduction
                    return new Herbivore(this.x, this.y);
                }
                return null;
            }
        }

        class Carnivore extends Organism {
            constructor(x, y) {
                super(x, y, 100); // Higher initial energy
                this.reproductionThreshold = 150;
            }

            hunt(herbivores) {
                for (let i = herbivores.length - 1; i >= 0; i--) {
                    const herbivore = herbivores[i];
                    if (herbivore.x === this.x && herbivore.y === this.y) {
                        this.energy += herbivore.energy * 0.8; // Gain energy from eating
                        herbivores.splice(i, 1); // Remove the herbivore
                        return;
                    }
                }
            }
             reproduce() {
                if (this.energy >= this.reproductionThreshold) {
                    this.energy -= 70; // Cost of reproduction
                    return new Carnivore(this.x, this.y);
                }
                return null;
            }
        }

        function setup() {
            // Set canvas size based on container
            const container = canvas.parentElement;
            const size = Math.min(container.clientWidth, window.innerHeight * 0.7);
            canvas.width = size;
            canvas.height = size;

            worldWidth = Math.floor(canvas.width / gridSize);
            worldHeight = Math.floor(canvas.height / gridSize);

            timeStep = 0;
            
            // Initialize world with plants
            world = Array.from({ length: worldHeight }, () =>
                Array.from({ length: worldWidth }, () => Math.random() < 0.3 ? 1 : 0) // 30% chance of plant
            );

            // Initialize populations
            herbivores = [];
            for (let i = 0; i < herbivoreSlider.value; i++) {
                herbivores.push(new Herbivore(
                    Math.floor(Math.random() * worldWidth),
                    Math.floor(Math.random() * worldHeight)
                ));
            }

            carnivores = [];
            for (let i = 0; i < carnivoreSlider.value; i++) {
                carnivores.push(new Carnivore(
                    Math.floor(Math.random() * worldWidth),
                    Math.floor(Math.random() * worldHeight)
                ));
            }

            draw();
            updateStats();
        }

        function update() {
            if (!simulationRunning) return;

            timeStep++;

            // Grow plants
            let plantGrowthRate = parseFloat(plantSlider.value);
            for (let y = 0; y < worldHeight; y++) {
                for (let x = 0; x < worldWidth; x++) {
                    if (Math.random() < plantGrowthRate) {
                        world[y][x] = 1;
                    }
                }
            }

            // Herbivore actions
            let newHerbivores = [];
            for (let i = herbivores.length - 1; i >= 0; i--) {
                const herbivore = herbivores[i];
                herbivore.move();
                herbivore.eat();

                if (!herbivore.isAlive()) {
                    herbivores.splice(i, 1);
                    continue;
                }

                const offspring = herbivore.reproduce();
                if (offspring) {
                    newHerbivores.push(offspring);
                }
            }
            herbivores.push(...newHerbivores);


            // Carnivore actions
            let newCarnivores = [];
            for (let i = carnivores.length - 1; i >= 0; i--) {
                const carnivore = carnivores[i];
                carnivore.move();
                carnivore.hunt(herbivores);

                if (!carnivore.isAlive()) {
                    carnivores.splice(i, 1);
                    continue;
                }
                
                const offspring = carnivore.reproduce();
                if (offspring) {
                    newCarnivores.push(offspring);
                }
            }
            carnivores.push(...newCarnivores);

            draw();
            updateStats();
            animationFrameId = requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw plants
            ctx.fillStyle = '#4ade80'; // Green
            for (let y = 0; y < worldHeight; y++) {
                for (let x = 0; x < worldWidth; x++) {
                    if (world[y][x] === 1) {
                        ctx.fillRect(x * gridSize, y * gridSize, gridSize, gridSize);
                    }
                }
            }

            // Draw herbivores
            ctx.fillStyle = '#60a5fa'; // Blue
            herbivores.forEach(h => {
                ctx.beginPath();
                ctx.arc(h.x * gridSize + gridSize / 2, h.y * gridSize + gridSize / 2, gridSize / 2.5, 0, 2 * Math.PI);
                ctx.fill();
            });

            // Draw carnivores
            ctx.fillStyle = '#f87171'; // Red
            carnivores.forEach(c => {
                 ctx.beginPath();
                ctx.moveTo(c.x * gridSize + gridSize / 2, c.y * gridSize);
                ctx.lineTo(c.x * gridSize, c.y * gridSize + gridSize);
                ctx.lineTo(c.x * gridSize + gridSize, c.y * gridSize + gridSize);
                ctx.closePath();
                ctx.fill();
            });
        }

        function updateStats() {
            timeStepEl.textContent = timeStep;
            plantStatEl.textContent = world.flat().filter(cell => cell === 1).length;
            herbivoreStatEl.textContent = herbivores.length;
            carnivoreStatEl.textContent = carnivores.length;
        }

        function toggleSimulation() {
            simulationRunning = !simulationRunning;
            if (simulationRunning) {
                startStopButton.textContent = 'Stop';
                startStopButton.classList.remove('bg-blue-500', 'hover:bg-blue-600');
                startStopButton.classList.add('bg-yellow-500', 'hover:bg-yellow-600');
                [herbivoreSlider, carnivoreSlider, plantSlider].forEach(s => s.disabled = true);
                update();
            } else {
                startStopButton.textContent = 'Start';
                startStopButton.classList.remove('bg-yellow-500', 'hover:bg-yellow-600');
                startStopButton.classList.add('bg-blue-500', 'hover:bg-blue-600');
                [herbivoreSlider, carnivoreSlider, plantSlider].forEach(s => s.disabled = false);
                cancelAnimationFrame(animationFrameId);
            }
        }

        // Event Listeners
        startStopButton.addEventListener('click', toggleSimulation);
        resetButton.addEventListener('click', () => {
            if (simulationRunning) {
                toggleSimulation();
            }
            setup();
        });

        herbivoreSlider.addEventListener('input', (e) => {
            herbivoreCount.textContent = e.target.value;
            if (!simulationRunning) setup();
        });
        carnivoreSlider.addEventListener('input', (e) => {
            carnivoreCount.textContent = e.target.value;
            if (!simulationRunning) setup();
        });
        plantSlider.addEventListener('input', (e) => {
            plantRate.textContent = e.target.value;
        });
        
        window.addEventListener('resize', setup);

        // Initial setup
        setup();
    </script>
</body>
</html>
