<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContactMap</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Protein Contact Map Generator</h1>
            <p id="typing-text" class="typing-container"></p>
            <nav>
                <a href="../index.html" class="nav-link">← Back to Bio Signal Hub</a>
            </nav>
        </header>

        <main>
            <div class="io-box upload-section">
                <h2>Upload PDB File</h2>
                <p class="description">Select a PDB file to calculate its contact map and view structural information.</p>
                <label for="pdb-upload" class="upload-btn">Select .pdb File</label>
                <input type="file" id="pdb-upload" accept=".pdb" hidden>
                
                <div id="progress-container" class="hidden">
                    <div id="progress-text">Processing... 0%</div>
                    <div class="progress-bar-background">
                        <div id="progress-bar"></div>
                    </div>
                </div>
            </div>

            <div id="results-section" class="hidden">
                <div class="pdb-info-container"></div>
                <div class="plot-container">
                    <div id="heatmap-plot"></div>
                </div>
            </div>
        </main>
        
        <footer>
            <p>&copy; 2025. GROMADS. All rights reserved.</p>
        </footer>
    </div>

    <script src="js/contactmap.js"></script>
</body>
</html>
