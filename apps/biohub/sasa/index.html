<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SASA Calculator</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/ngl@2.0.0-dev.38/dist/ngl.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>SASA Calculator</h1>
            <p id="typing-text" class="typing-container"></p>
            <nav>
                <a href="../index.html" class="nav-link">← Back to BioHub</a>
            </nav>
        </header>

        <main>
            <div class="converter-grid">
                <div class="io-box">
                    <h2>PDB Input</h2>
                    <label for="pdb-upload" class="upload-btn">Upload PDB File</label>
                    <input type="file" id="pdb-upload" accept=".pdb" hidden>
                    <textarea id="pdb-input" rows="15" placeholder="Or paste PDB content here..."></textarea>
                    
                    <div class="parameters-box">
                        <h3>Parameters</h3>
                        <div class="param-group">
                            <label for="probe-radius">Probe Radius (Å):</label>
                            <input type="number" id="probe-radius" value="1.4" min="0.5" max="3.0" step="0.1">
                            <span class="param-info">Default: 1.4 Å (water molecule)</span>
                        </div>
                        <div class="param-group">
                            <label for="n-points">Sampling Points:</label>
                            <input type="number" id="n-points" value="100" min="50" max="500" step="50">
                            <span class="param-info">Higher = more accurate but slower</span>
                        </div>
                    </div>
                </div>

                <div class="io-box">
                    <h2>SASA Results</h2>
                    <div class="output-controls">
                        <button id="copy-btn">Copy Results</button>
                        <button id="download-btn">Download CSV</button>
                    </div>
                    <div id="results-container">
                        <div id="total-sasa" class="sasa-summary"></div>
                        <div id="viewer-container" style="display: none; margin: 20px 0;">
                            <h3 style="font-size: 14px; margin-bottom: 10px;">3D Visualization</h3>
                            <div class="viewer-controls" style="margin-bottom: 10px;">
                                <button id="toggle-spin" class="control-button" style="padding: 8px 16px; margin-right: 10px; background: var(--primary-color); color: white; border: none; border-radius: 4px; cursor: pointer;">Toggle Spin</button>
                                <button id="center-view" class="control-button" style="padding: 8px 16px; margin-right: 10px; background: var(--primary-color); color: white; border: none; border-radius: 4px; cursor: pointer;">Center View</button>
                                <button id="test-viewer" class="control-button" style="padding: 8px 16px; background: #ffc107; color: #000; border: none; border-radius: 4px; cursor: pointer;">🔍 Test Viewer</button>
                            </div>
                            <div id="viewport" style="width: 100%; height: 400px; background: #000; border-radius: 4px; border: 2px solid var(--primary-color);"></div>
                            <div style="margin-top: 10px; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 4px;">
                                <div style="font-size: 12px; font-weight: 500; margin-bottom: 8px; color: var(--color-text-secondary);">SASA Color Scale:</div>
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <span style="font-size: 11px; color: var(--color-text-secondary);">Buried</span>
                                    <div style="flex: 1; height: 20px; background: linear-gradient(to right, #0000FF, #00FFFF, #00FF00, #FFFF00, #FF0000); border-radius: 4px;"></div>
                                    <span style="font-size: 11px; color: var(--color-text-secondary);">Exposed</span>
                                </div>
                            </div>
                        </div>
                        <textarea id="results-output" rows="12" readonly placeholder="Detailed results will appear here..."></textarea>
                    </div>
                    <div id="residue-chart" class="chart-container"></div>
                </div>

                <button id="calculate-btn">Calculate SASA</button>
                <button id="clear-btn">Clear</button>
            </div> 
        </main>
        <footer>
            <p>© 2025. GROMADS. All rights reserved.</p>
        </footer>
    </div>

    <script src="js/sasa.js"></script>
</body>
</html>
