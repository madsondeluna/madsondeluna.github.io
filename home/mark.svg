     tracar os 60px originais devolveria a escada de amostragem em
     vetor, e depois ajustado a uma spline periodica: fechada, sem
     emenda no ponto inicial.
     A tinta e literal e nao currentColor: a aba do navegador nao
     resolve var() nem currentColor. Para uso DENTRO da pagina, copie
     este arquivo trocando o fill por currentColor e a marca passa a
     seguir o modo sozinha. -->
