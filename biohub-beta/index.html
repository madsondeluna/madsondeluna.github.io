<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioHub</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container"> <header>
            <img src="images/icon.png" alt="Logotipo" class="header-logo">
            <h1>BioHub</h1>
            <p id="typing-text" class="typing-container"></p>
        </header>

        <main>
            <div class="tool-cards-container">
                
                <a href="pdb2fasta.html" target="_blank" rel="noopener noreferrer" class="tool-card">
                    <h3>PDB2FASTA</h3>
                    <p>A client-side tool to convert protein structures in PDB format to FASTA sequences quickly and efficiently.</p>
                </a>

                <a href="bioparam.html" target="_blank" rel="noopener noreferrer" class="tool-card">
                    <h3>BioParam</h3>
                    <p>Calculate a variety of physicochemical parameters from a protein sequence, including molecular weight, pI, and more.</p>
                </a>

                </div>
        </main>
        
        <footer>
            <p>© 2025. GROMADS. All rights reserved.</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const typingElement = document.getElementById('typing-text');
            const textToType = "A collection of bioinformatics tools for biological sequences...";
            const typingSpeed = 75;
            let charIndex = 0;
            function type() {
                if (charIndex < textToType.length) {
                    typingElement.textContent += textToType.charAt(charIndex);
                    charIndex++;
                    setTimeout(type, typingSpeed);
                }
            }
            if (typingElement) type();
        });
    </script>
</body>
</html>
