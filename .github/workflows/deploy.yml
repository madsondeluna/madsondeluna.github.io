name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # disparado pelo repositorio pure-design-language a cada push na main
  repository_dispatch:
    types: [pure-updated]
  # rede de seguranca caso o dispatch nao chegue
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out the pure design language
        uses: actions/checkout@v7
        with:
          repository: madsondeluna/pure-design-language
          path: pure-src
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Refresh apps/pure from the language repository
        run: npm run sync:pure

      - run: npm run build

      - name: Copy legacy static assets
        run: |
          cp -r assets out/
          cp -r apps out/
          cp -r games out/
          cp -r materials out/
          cp google2a0f51da71f41d93.html out/
          cp sitemap.xml out/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
